name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned to 3.9 deliberately: production runs 3.9.6 (see
    # ARCHITECTURE.md). A few annotations in src/services/ use `X | None`
    # and only survive because `from __future__ import annotations` defers
    # evaluation and nothing calls get_type_hints() on those specific
    # functions. Testing on a newer interpreter would hide that landmine
    # instead of catching it.
    strategy:
      matrix:
        python-version: ["3.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Import smoke test
        run: python -c "import main; print('main imports OK')"

      - name: Run tests
        run: pytest -q

      # G5: the real gate -- hooks/pre-commit runs the same scan locally
      # but soft-fails if detect-secrets isn't installed (not every clone
      # has run `pip install -e .[dev]`). This step can't be skipped.
      - name: Secret scan (detect-secrets)
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files | grep -v '^archive/')

      # G6: same split as hooks/pre-commit -- lint is a real gate (passes
      # clean today), format is informational only until a deliberate
      # one-time `ruff format .` pass lands (see hooks/pre-commit for why
      # that's not bundled into this commit).
      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (informational, not a gate yet)
        run: ruff format --check . || true
