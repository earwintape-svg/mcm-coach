[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timely"
version = "0.1.0"
description = "Single-user marathon-training coach: Garmin Connect workout uploader + FastAPI dashboard, with intervals.icu actuals and a Google Calendar mirror."
readme = "README.md"
# Production runs Python 3.9.6, full stop (see ARCHITECTURE.md). The
# FastAPI route signatures rely on this being enforced -- get_type_hints()
# at startup will crash on `X | Y` annotations if a newer interpreter
# papers over a mistake that 3.9 would have caught immediately.
requires-python = ">=3.9,<3.10"
dependencies = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "google-api-python-client>=2.130.0,<3.0",
    "google-auth-httplib2>=0.2.0,<1.0",
    "google-auth-oauthlib>=1.2.0,<2.0",
    "garminconnect>=0.2.8,<1.0",
]

[project.optional-dependencies]
# httpx2 is what this version of starlette's TestClient (tests/test_api.py)
# actually requires -- if a different pinned fastapi/starlette version
# wants a different test-client package, pytest's collection error names
# it explicitly; swap accordingly.
dev = [
    "pytest>=7.0,<10.0", "httpx2", "ruff>=0.6,<1.0", "detect-secrets>=1.5,<2.0",
    # mypy>=2.0 dropped --python-version 3.9 support -- pin below that so
    # this can actually target the version prod runs (see [tool.mypy]).
    "mypy>=1.10,<2.0",
]

# The repo predates packaging: most modules are flat files at the root
# (builders.py, plan.py, store.py, main.py, ...) rather than nested under
# src/, because lan.sh's sync_app() deploys by copying individual files
# into ~/Library/Application Support/MCMCoach, not by installing a wheel.
# `pip install -e .` lists them explicitly here so `import store` etc.
# work the same way from tests/ as they do when main.py runs from the repo
# root, removing the need for tests/conftest.py's sys.path hack -- without
# changing that deploy shape.
[tool.setuptools]
py-modules = [
    "builders", "plan", "store", "main", "coach",
    "upload_garmin_workouts", "intervalsicu_read", "setup_gcal", "make_demo",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# G6: ruff does both linting and formatting -- one tool instead of the
# brief's suggested ruff+black combo, since ruff's own formatter has
# covered black's job since ~0.1 and a second tool/config to keep in sync
# isn't worth it for a single-user repo. Pinned to py39 because that's
# what's actually deployed (see the 3.9 note in ARCHITECTURE.md) -- ruff
# needs to see what prod sees, same reasoning as the CI Python pin.
[tool.ruff]
target-version = "py39"
extend-exclude = ["archive"]  # frozen reference, see AGENTS.md -- not ours to reformat

[tool.ruff.lint]
# Default rule set (E/F) is enough here: unused imports/vars and basic
# style. Not reaching for ruff's stricter rule families (B, UP, SIM, ...)
# in one pass -- that's a separate, larger-diff decision for later, not
# bundled into "stand up the tool."

# G7: mypy, pinned to 3.9 for the same reason ruff/CI are -- it needs to
# see what prod sees, or it can't catch the next `X | None`-style
# landmine (the whole point of this ticket). Scoped to exactly the files
# pyproject.toml's own [tool.setuptools] lists as the installable package
# (py-modules + src/) -- tests/ and archive/ are deliberately excluded:
# tests aren't shipped, and archive/ is frozen reference (AGENTS.md).
# follow_imports=skip: dependencies like anyio ship match-statement
# syntax that doesn't even parse under --python-version 3.9 (a real
# limitation hit while standing this up, not a style choice) -- skip
# treats every third-party import as Any rather than trying to check
# code that was never written to run on 3.9 anyway. Note: mypy >=2.0
# dropped support for --python-version 3.9 entirely; the dev extra below
# pins mypy<2.0 so `pip install -e .[dev]` actually gets a version that
# can target what prod runs.
[tool.mypy]
python_version = "3.9"
follow_imports = "skip"
ignore_missing_imports = true
files = [
    "builders.py", "plan.py", "store.py", "main.py", "coach.py",
    "upload_garmin_workouts.py", "intervalsicu_read.py", "setup_gcal.py",
    "make_demo.py", "src",
]
