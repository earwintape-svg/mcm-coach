[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timely"
version = "0.1.0"
description = "Single-user marathon-training coach: Garmin Connect workout uploader + FastAPI dashboard, with intervals.icu actuals and a Google Calendar mirror."
readme = "README.md"
# Production runs Python 3.9.6, full stop (see ARCHITECTURE.md). The
# FastAPI route signatures rely on this being enforced -- get_type_hints()
# at startup will crash on `X | Y` annotations if a newer interpreter
# papers over a mistake that 3.9 would have caught immediately.
requires-python = ">=3.9,<3.10"
dependencies = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "google-api-python-client>=2.130.0,<3.0",
    "google-auth-httplib2>=0.2.0,<1.0",
    "google-auth-oauthlib>=1.2.0,<2.0",
    "garminconnect>=0.2.8,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9.0"]

# The repo predates packaging: most modules are flat files at the root
# (builders.py, plan.py, store.py, main.py, ...) rather than nested under
# src/, because lan.sh's sync_app() deploys by copying individual files
# into ~/Library/Application Support/MCMCoach, not by installing a wheel.
# `pip install -e .` lists them explicitly here so `import store` etc.
# work the same way from tests/ as they do when main.py runs from the repo
# root, removing the need for tests/conftest.py's sys.path hack -- without
# changing that deploy shape.
[tool.setuptools]
py-modules = [
    "builders", "plan", "store", "main", "coach",
    "upload_garmin_workouts", "intervalsicu_read", "setup_gcal", "make_demo",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
